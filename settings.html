<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки — Smart Campus AI</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout"><nav id="nav"></nav><main>
<h1>Настройки</h1>
<div class="card" style="max-width:420px">
  <label>Название кампуса</label>
  <input id="campus" style="width:100%">
  <label style="display:block;margin-top:12px">Тема</label>
  <select id="theme" style="width:100%">
    <option value="light">Светлая</option>
    <option value="dark">Тёмная</option>
  </select>
  <div class="toolbar" style="margin-top:16px">
    <button onclick="save()">Сохранить</button>
    <button onclick="reset()" style="background:#c9402a">Сбросить данные</button>
  </div>
</div>
</main></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/settings.js"></script>
</body></html>
